[package]
name = "fastlink-cli"
version = "0.1.0"
edition = "2021"
description = "FastLink Command Line Interface"

[[bin]]
name = "fastlink"
path = "src/main.rs"

[dependencies]
mother-protocol = { path = "../../core/mother-protocol" }
libfastcrypto = { path = "../../core/libfastcrypto" }
libcommon = { path = "../../core/libcommon" }

tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.4", features = ["derive"] }
anyhow = "1.0"
parking_lot = "0.12"
