name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 2 * * *'  # 每天凌晨2点运行

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: Code Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-action@stable
        with:
          components: rustfmt, clippy
      
      - name: Check formatting
        run: cargo fmt --all -- --check
      
      - name: Run clippy
        run: cargo clippy --all --all-targets -- -D warnings

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust: [1.75, stable, beta]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Install Rust ${{ matrix.rust }}
        uses: dtolnay/rust-action@${{ matrix.rust }}
        with:
          components: rustfmt, clippy
      
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: target
      
      - name: Check
        run: cargo check --workspace --all-features
      
      - name: Build
        run: cargo build --workspace --all-features
      
      - name: Test
        run: cargo test --workspace --all-features -- --test-threads=4
      
      - name: Test Documentation
        run: cargo test --workspace --doc

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-action@stable
      
      - name: Install cargo-tarpaulin
        uses: taiki-e/install-action@cargo-tarpaulin
      
      - name: Coverage
        run: cargo tarpaulin --workspace --out Xml --ignore-tests
      
      - name: Upload to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./tarpaulin-report.xml
          fail_ci_if_error: true

  bench:
    name: Benchmarks
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-action@stable
      
      - name: Run benchmarks
        run: cargo bench --workspace
      
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: benchmarks
          path: target/criterion/

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-action@stable
      
      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit
      
      - name: Audit dependencies
        run: cargo audit

  doc:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-action@stable
        with:
          components: rustdoc
      
      - name: Generate documentation
        run: cargo doc --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings
      
      - name: Deploy documentation
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./target/doc
          publish_branch: gh-pages

  build-release:
    name: Release Build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Install Rust ${{ matrix.rust }}
        uses: dtolnay/rust-action@${{ matrix.rust }}
        with:
          profile: minimal
      
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: target
      
      - name: Build release
        run: cargo build --release --workspace
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fastlink-${{ matrix.os }}-release
          path: |
            target/release/fastlink
            target/release/fastlink.exe
          retention-days: 7

  # Windows specific checks
  windows-checks:
    name: Windows Compatibility
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-action@stable
      
      - name: Check Windows compatibility
        run: |
          cargo check --workspace --target x86_64-pc-windows-msvc
          cargo test --workspace --test-threads=2

  # Cross compilation checks
  cross-check:
    name: Cross Compilation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-action@stable
        with:
          targets: aarch64-unknown-linux-gnu, thumbv7em-none-eabihf
      
      - name: Install qemu
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user
      
      - name: Check cross compilation
        run: |
          cargo check --workspace --target aarch64-unknown-linux-gnu
          cargo check --workspace --target thumbv7em-none-eabihf
