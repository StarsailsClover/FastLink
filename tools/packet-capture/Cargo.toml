[package]
name = "fastlink-packet-capture"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "packet-capture"
path = "src/main.rs"

[dependencies]
libfasttransport = { path = "../../core/libfasttransport" }
libcommon = { path = "../../core/libcommon" }

tokio = { version = "1.35", features = ["full"] }
clap = { version = "4.4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
