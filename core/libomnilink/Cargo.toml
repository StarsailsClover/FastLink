[package]
name = "libomnilink"
version = "0.1.0"
edition = "2021"
description = "FastLink Adaptive NAT Traversal Engine and Smart Scheduler"

[dependencies]
mother-protocol = { path = "../mother-protocol" }
libfastcrypto = { path = "../libfastcrypto" }
libcommon = { path = "../libcommon" }

tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
tracing = "0.1"
thiserror = "1.0"
anyhow = "1.0"
async-trait = "0.1"
bytes = "1.5"
futures = "0.3"
parking_lot = "0.12"
dashmap = "5.5"
socket2 = "0.5"
mio = "0.8"
rand = "0.8"
if-addrs = "0.11"
crc32fast = "1.3"

[dev-dependencies]
tokio-test = "0.4"
proptest = "1.4"

[features]
default = []
