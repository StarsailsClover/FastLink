[package]
name = "libfastcrypto"
version = "0.1.0"
edition = "2021"
description = "FastLink Unified Cryptography and Security Library"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
thiserror = "1.0"
anyhow = "1.0"
bytes = "1.5"
ring = "0.17"
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
ed25519-dalek = { version = "2.0", features = ["rand_core"] }
blake3 = "1.5"
hkdf = "0.12"
hmac = "0.12"
sha2 = "0.10"
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
crc32fast = "1.3"
rand = "0.8"
rand_chacha = "0.3"
getrandom = "0.2"
hex = "0.4"
base64 = "0.21"
parking_lot = "0.12"
dashmap = "5.5"
once_cell = "1.19"
zeroize = { version = "1.7", features = ["derive"] }

[dev-dependencies]
criterion = "0.5"
proptest = "1.4"

[features]
default = []
