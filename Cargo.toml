[workspace]
resolver = "2"
members = [
    # 核心库
    "core/mother-protocol",
    "core/libfastcrypto",
    "core/libcommon",
    "core/libomnilink",
    "core/libfasttransport",
    "core/libfastdht",
    "core/libantidpi",
    "core/libnetworktest",
    
    # 子协议
    "protocols/fastlink-p2p",
    "protocols/fastlink-server",
    "protocols/fastlink-swift",
    "protocols/fastlink-games",
    "protocols/fastlink-aztec",
    "protocols/fastlink-chat",
    
    # 工具
    "tools/test-framework",
    "tools/packet-capture",
    "tools/benchmarks",
    "tools/nat-simulator",
    
    # CLI 应用
    "apps/fastlink-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["FastLink Team <team@fastlink.rs>"]
license = "MIT"
description = "High-performance P2P networking protocol suite"
homepage = "https://github.com/fastlink-rs/fastlink"
repository = "https://github.com/fastlink-rs/fastlink"
documentation = "https://docs.fastlink.rs"
keywords = ["p2p", "networking", "vpn", "distributed", "mesh"]
categories = ["network-programming", "cryptography"]

[workspace.dependencies]
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
thiserror = "1.0"
anyhow = "1.0"
async-trait = "0.1"
bytes = "1.5"
futures = "0.3"
pin-project = "1.1"
parking_lot = "0.12"
dashmap = "5.5"
once_cell = "1.19"
hex = "0.4"
base64 = "0.21"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
clap = { version = "4.4", features = ["derive"] }
config = "0.14"
rand = "0.8"
getrandom = "0.2"
ring = "0.17"
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
ed25519-dalek = { version = "2.0", features = ["rand_core"] }
blake3 = "1.5"
hkdf = "0.12"
hmac = "0.12"
sha2 = "0.10"
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
crc32fast = "1.3"
byteorder = "1.5"
socket2 = "0.5"
mio = "0.8"
yamux = "0.10"
rustls = { version = "0.21", features = ["dangerous_configuration"] }
webpki-roots = "0.25"
quote = "1.0"
proc-macro2 = "1.0"
prost = "0.12"
tonic = "0.10"
rand_distr = "0.4"
statistics = "0.1"
bincode = "1.3"
criterion = { version = "0.5", features = ["html_reports"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0
debug = true

[profile.bench]
inherits = "release"
