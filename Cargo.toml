[workspace]
resolver = "2"
members = [
    # 核心
    "core/mother-protocol",
    "core/libfastcrypto",
    "core/libcommon",
    "core/libomnilink",
    "core/libfasttransport",
    "core/libfastdht",
    "core/libantidpi",
    "core/libnetworktest",
    
    # 协议
    "protocols/fastlink-p2p",
    "protocols/fastlink-server",
    "protocols/fastlink-swift",
    "protocols/fastlink-games",
    "protocols/fastlink-aztec",
    "protocols/fastlink-chat",
    
    # 工具
    "tools/test-framework",
    "tools/packet-capture",
    "tools/benchmarks",
    "tools/nat-simulator",
    
    # CLI 应用
    "apps/fastlink-cli",
]

[workspace.package]
version = "26.14-20260608"
edition = "2021"
authors = ["SailsClover <sailshuang@gmail.com>"]
license = "MIT"
description = "High-performance P2P networking protocol suite"
homepage = "https://github.com/StarsailsClover/FastLink"
repository = "https://github.com/StarsailsClover/FastLink"
documentation = "https://docs.fastlink.rs"
keywords = ["p2p", "networking", "vpn", "distributed", "mesh"]
categories = ["network-programming", "cryptography"]

[workspace.dependencies]
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
thiserror = "1.0"
anyhow = "1.0"
async-trait = "0.1"
bytes = "1.5"
futures = "0.3"
pin-project = "1.1"
parking_lot = "0.12"
dashmap = "5.5"
once_cell = "1.19"
hex = "0.4"
base64 = "0.21"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
clap = { version = "4.4", features = ["derive"] }
config = "0.14"
rand = "0.8"
getrandom = "0.2"
ring = "0.17"
ed25519-dalek = "2.1"
x25519-dalek = "2.0"
hmac = "0.12"
sha2 = "0.10"
blake3 = "1.5"
bincode = "1.3"
toml = "0.8"

# TLS/加密相关
rustls = "0.21"
rustls-pemfile = "1.0"
tokio-rustls = "0.24"
webpki-roots = "0.25"

# 网络相关
socket2 = "0.5"
ipnet = "2.9"

# 其他
bitflags = "2.4"
zeroize = { version = "1.7", features = ["derive"] }
secrecy = "0.8"
